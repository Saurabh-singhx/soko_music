<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Neon Wave Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shadow & Rounded Squircle Container -->
  
  

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.12" filter="blur(40px)" />
  <circle cx="210" cy="220" r="80" fill="#38BDF8" opacity="0.15" filter="blur(30px)" />

  <!-- Central Musical Wave + Lightning Bolt Iconography -->
  <g filter="url(#neon-blur)">
    <!-- Stylized Modern Music Note with Soundwave Elements -->
    <!-- Left Note Stem & Wave Bar 1 -->
    <rect x="156" y="240" width="16" height="84" rx="8" fill="url(#neon-glow)" />
    <!-- Wave Bar 2 -->
    <rect x="188" y="196" width="16" height="128" rx="8" fill="url(#neon-glow)" />

    <!-- Center Note Head & Stem -->
    <circle cx="228" cy="336" r="32" fill="url(#neon-glow)" />
    <path d="M244 140 L244 336" stroke="url(#neon-glow)" stroke-width="16" stroke-linecap="round" />

    <!-- Top Connected Fluid Beam -->
    <path d="M244 152 C290 136, 320 156, 356 180 L356 308" stroke="url(#neon-glow)" stroke-width="16" stroke-linecap="round" fill="none" />
    <circle cx="340" cy="308" r="28" fill="url(#neon-glow)" />

    <!-- Wave Bar 4 -->
    <rect x="376" y="212" width="16" height="96" rx="8" fill="url(#neon-glow)" />

    <!-- Offline Lightning/Flash Accent Overlay (representing instant local playback) -->
    <path d="M284 196 L254 252 L282 252 L250 316 L302 244 L274 244 Z" fill="#FACC15" opacity="0.95">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
